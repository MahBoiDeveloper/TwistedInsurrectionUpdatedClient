name: Update XNA CnCNet Client Release

on:
  workflow_dispatch:  # This allows manual triggering from GitHub Actions UI
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight (UTC), adjust to your needs

jobs:
  download-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Download latest XNA client release
      uses: robinraju/release-downloader@v1
      with:
        repository: CnCNet/xna-cncnet-client
        latest: true
        fileName: xna-cncnet-client*

    - name: Extract release contents
      run: |
        7z x xna-cncnet-client-*.7z -oResources
        rm xna-cncnet-client-*.7z

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Check for changes
      id: check_changes
      run: |
        if (git status --porcelain) {
          echo "changed=true" >> $env:GITHUB_ENV
        } else {
          echo "changed=false" >> $env:GITHUB_ENV
        }

    - name: Commit and push changes
      if: env.changed == 'true'
      run: |
        $branch = "update-xna-client"
        git checkout -b $branch
        git add Resources
        git commit -m "Update XNA CnCNet Client binaries"
        git push origin $branch

    - name: Create Pull Request
      if: env.changed == 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: update-xna-client
        title: "Update XNA CnCNet Client binaries"
        body: "Automated update of Resources folder from latest release."
        base: main

