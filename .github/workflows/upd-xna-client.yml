name: Update XNA CnCNet Client

on:
  workflow_dispatch:

env:
  REPO_NAME: TwistedInsurrectionUpdatedClient
  UPDATE_BRANCH_NAME: update-client-binaries
  COMMIT_MESSAGE: Update client binaries to the latest version
  PR_TITLE: Update client binaries to the latest version
  PR_BODY: This is an automatic pull request to update client binaries triggered from CnCNet/xna-cncnet-client repository.

jobs:
  publish-update-pr:
    runs-on: windows-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3
    
    - name: Configure Git Repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git branch -d ${{ env.UPDATE_BRANCH_NAME }}
        git checkout -b ${{ env.UPDATE_BRANCH_NAME }}
    
    - name: Download Latest Release
      id: download
      uses: robinraju/release-downloader@v1
      with:
        repository: CnCNet/xna-cncnet-client
        latest: true
        fileName: xna-cncnet-client*

    - name: Get Current Client Version
      id: current_version
      run: |
        $currentVersion = (Get-ItemProperty -Path "D:\a\${{ env.REPO_NAME }}\${{ env.REPO_NAME }}\Resources\clientdx.exe" -Name VersionInfo).VersionInfo.FileVersion -replace '\.0$', ''
        echo "current_version=$currentVersion" >> $GITHUB_ENV
        echo "Current client version: $currentVersion"
        echo "Downloaded client version: ${{ steps.download.outputs.tag_name }}"

    - name: Compare Versions
      id: check_update
      run: |
        if ($env:current_version -ne '${{ steps.download.outputs.tag_name }}') {
          echo "update_required=true" >> $GITHUB_ENV
        } else {
          echo "update_required=false" >> $GITHUB_ENV
        }

    - name: Extract Release Contents
      if: env.update_required == 'true'
      run: |
        rm -r -fo "D:\a\${{ env.REPO_NAME }}\${{ env.REPO_NAME }}\Resources\Binaries"
        rm -r -fo "D:\a\${{ env.REPO_NAME }}\${{ env.REPO_NAME }}\Resources\BinariesNET8"
        7z x xna-cncnet-client-*.7z -y -oD:\a\${{ env.REPO_NAME }}\${{ env.REPO_NAME }}
        rm xna-cncnet-client-*.7z

    - name: Commit And Push Branch
      if: env.update_required == 'true'
      run: |
        git commit -am "${{ env.COMMIT_MESSAGE }}"
        git push --force origin ${{ env.UPDATE_BRANCH_NAME }}

    - name: Open PR
      if: env.update_required == 'true'
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr create -B main -H ${{ env.UPDATE_BRANCH_NAME }} --title '${{ env.PR_TITLE }}' --body '${{ env.PR_BODY }}'
