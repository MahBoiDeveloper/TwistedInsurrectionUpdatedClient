name: Update XNA CnCNet Client Release

on:
  workflow_dispatch:  # This allows manual triggering from GitHub Actions UI
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight (UTC), adjust to your needs

jobs:
  download-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq unzip

    - name: Download Cppcheck
      uses: robinraju/release-downloader@v1
      with:
        repository: CnCNet/xna-cncnet-client
        latest: true
        fileName: xna-cncnet-client*

    - name: Extract release contents
      run: |
        unzip xna-cncnet-client-*.zip -d Resources

    - name: Clean up
      run: |
        rm xna-cncnet-client-*.zip
